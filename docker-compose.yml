services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab21}
      POSTGRES_USER: ${POSTGRES_USER:-lab21}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab21} -d ${POSTGRES_DB:-lab21}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-model:
    image: curlimages/curl:latest
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_MODEL: ${LLM_MODEL:-lakomoor/vikhr-llama-3.2-1b-instruct:1b}
    command:
      - /bin/sh
      - -c
      - |
        until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 2; done
        curl -sf http://ollama:11434/api/pull -d "{\"name\":\"$${OLLAMA_MODEL}\"}"
    restart: "no"

  bot:
    build:
      context: .
      args:
        GIT_SHA: ${APP_GIT_SHA:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lab21}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lab21}
      CONTROL_DIR: /control
      UPLOAD_DIR: /app/uploads
      TELEGRAM_PROXIES: ${TELEGRAM_PROXIES:-}
    volumes:
      - control_data:/control
      - uploads_data:/app/uploads
      # Optional: mount OpenVINO IR when LLM_PROVIDER=openvino inside a Linux host with NPU
      - ${OPENVINO_MODEL_DIR:-./models}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Optional AmneziaWG exits for Telegram API (profile: amnezia).
  # Put client .conf files into secrets/amnezia-a and secrets/amnezia-b.
  # Then: COMPOSE_PROFILES=ollama,amnezia  (or amnezia alone)
  # TELEGRAM_PROXIES=socks5://amnezia-a:1080,socks5://amnezia-b:1080
  amnezia-a:
    profiles: ["amnezia"]
    image: ghcr.io/mainfrezzer/amnezia-bridge:latest
    container_name: lab21-amnezia-a
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./secrets/amnezia-a:/etc/amnezia/amneziawg:ro
    environment:
      LAN_NETWORK: ${AMNEZIA_LAN_NETWORK:-192.168.0.0/16}
      ENABLE_RANDOM: ${AMNEZIA_ENABLE_RANDOM:-1}
      HEALTH_URL_CHECK: ${AMNEZIA_HEALTH_URL:-1.1.1.1}

  amnezia-b:
    profiles: ["amnezia"]
    image: ghcr.io/mainfrezzer/amnezia-bridge:latest
    container_name: lab21-amnezia-b
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./secrets/amnezia-b:/etc/amnezia/amneziawg:ro
    environment:
      LAN_NETWORK: ${AMNEZIA_LAN_NETWORK:-192.168.0.0/16}
      ENABLE_RANDOM: ${AMNEZIA_ENABLE_RANDOM:-1}
      HEALTH_URL_CHECK: ${AMNEZIA_HEALTH_URL:-1.1.1.1}

  admin:
    build:
      context: .
      args:
        GIT_SHA: ${APP_GIT_SHA:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lab21}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lab21}
      UPLOAD_DIR: /app/uploads
    command: ["sh", "-c", "alembic upgrade head && exec lab21-admin"]
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile.watchdog
    restart: unless-stopped
    environment:
      CONTROL_DIR: /control
      REPO_DIR: /deploy
      REPO_URL: ${REPO_URL:-https://github.com/Freimor/PROJECT_21Lab_bot.git}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-lab21}
      WATCHDOG_POLL_SECONDS: ${WATCHDOG_POLL_SECONDS:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control_data:/control
      - deploy_repo:/deploy
      - ./.env:/deploy/.env:ro
    depends_on:
      bot:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
  control_data:
  deploy_repo:
  uploads_data:
