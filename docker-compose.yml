services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab21}
      POSTGRES_USER: ${POSTGRES_USER:-lab21}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab21} -d ${POSTGRES_DB:-lab21}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["llm"]

  ollama-model:
    image: curlimages/curl:latest
    profiles: ["llm"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_MODEL: ${LLM_MODEL:-qwen3:4b}
    command:
      - /bin/sh
      - -c
      - |
        until curl -sf http://ollama:11434/api/tags >/dev/null; do sleep 2; done
        curl -sf http://ollama:11434/api/pull -d "{\"name\":\"$${OLLAMA_MODEL}\"}"
    restart: "no"

  bot:
    build:
      context: .
      args:
        GIT_SHA: ${APP_GIT_SHA:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lab21}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lab21}
      CONTROL_DIR: /control
    volumes:
      - control_data:/control
    depends_on:
      postgres:
        condition: service_healthy

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile.watchdog
    restart: unless-stopped
    environment:
      CONTROL_DIR: /control
      REPO_DIR: /deploy
      REPO_URL: ${REPO_URL:-https://github.com/Freimor/PROJECT_21Lab_bot.git}
      GITHUB_BRANCH: ${GITHUB_BRANCH:-main}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-lab21}
      WATCHDOG_POLL_SECONDS: ${WATCHDOG_POLL_SECONDS:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - control_data:/control
      - deploy_repo:/deploy
      - ./.env:/deploy/.env:ro
    depends_on:
      bot:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
  control_data:
  deploy_repo:
