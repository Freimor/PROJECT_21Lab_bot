[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lab21-bot"
version = "0.1.0"
description = "Telegram concierge, content and community economy bot for Lab21"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.30.0",
    "alembic==1.18.5",
    "apscheduler==3.11.3",
    "asyncpg==0.31.0",
    "fastapi==0.135.1",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.22",
    "sqlalchemy[asyncio]==2.0.51",
    "structlog==26.1.0",
    "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite==0.22.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.1",
]

[project.scripts]
lab21-bot = "lab21_bot.main:run"
lab21-admin = "lab21_bot.admin.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lab21_bot = [
    "admin/templates/*.html",
    "admin/static/*",
    "data/*.json",
    "data/faq/*.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lab21_bot"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

